<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>02 | Видео</title>

    <script src="/libs/aframe-master.min.js"></script>
    <script src="/libs/mindar-image-aframe.prod.js"></script>
    <script src="/libs/browser@4.js"></script>
    <script src="/scripts.js"></script>
    <script src="/components.js"></script>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="/styles.css" />
  </head>
  <body class="m-0 p-0 h-full overflow-hidden">
    <home-button></home-button>
    <welcome-screen variant="02 | Видео"></welcome-screen>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;"
      color-space="sRGB"
      vr-mode-ui="enabled: false;"
      renderer="colorManagement: true, physicallyCorrectLights"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false;">
      <a-assets crossorigin="anonymous">
        <video
          id="video"
          src="./video.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"></video>
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          src="#video"
          width="1.02"
          height="1.52"
          position="0 0 0"
          rotation="0 0 0"></a-video
      ></a-entity>
    </a-scene>

    <custom-notification type="vpn"></custom-notification>

    <script>
      initScene().catch(console.error)

      handleTarget({
        found: () => {
          const video = document.getElementById('video')
          if (video.ended) video.currentTime = 0
          video.play()
        },
        lost: () => {
          document.getElementById('video').pause()
        },
      })
    </script>
  </body>
</html>
